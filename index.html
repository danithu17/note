<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScribbleNote" />
    <link rel="manifest" href="/manifest.json" />
    <title>ScribbleNote - Hybrid Lecture Notes & Visual Canvas</title>

    <script>
      (function() {
        // 1. Purge legacy service workers and stale caches on localhost
        if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }
        }

        // 2. Immediate synchronous OAuth Token extraction from URL hash
        var hash = window.location.hash;
        if (hash && hash.indexOf('access_token=') !== -1) {
          try {
            var params = new URLSearchParams(hash.substring(1));
            var token = params.get('access_token');
            if (token) {
              var part = token.split('.')[1];
              if (part) {
                var b64 = part.replace(/-/g, '+').replace(/_/g, '/');
                var mod = b64.length % 4;
                if (mod === 1) b64 = b64.slice(0, -1);
                else if (mod === 2) b64 += '==';
                else if (mod === 3) b64 += '=';

                var binary = atob(b64);
                var emailMatch = binary.match(/"email"\s*:\s*"([^"]+)"/);
                var email = emailMatch ? emailMatch[1] : '';
                var nameMatch = binary.match(/"full_name"\s*:\s*"([^"]+)"/) || binary.match(/"name"\s*:\s*"([^"]+)"/);
                var name = nameMatch ? nameMatch[1] : (email ? email.split('@')[0] : 'Scholar');
                var avatarMatch = binary.match(/"avatar_url"\s*:\s*"([^"]+)"/) || binary.match(/"picture"\s*:\s*"([^"]+)"/);
                var avatar = avatarMatch ? avatarMatch[1] : '';
                var subMatch = binary.match(/"sub"\s*:\s*"([^"]+)"/);
                var userId = subMatch ? subMatch[1] : (email ? 'usr_' + email.replace(/[^a-zA-Z0-9]/g, '_') : 'usr_default');

                var isAdmin = email.toLowerCase() === 'nimjayad@gmail.com';
                var account = {
                  id: userId,
                  email: email,
                  name: isAdmin ? 'Nimjaya (Admin)' : name,
                  avatarUrl: avatar,
                  isGuest: false,
                  plan: isAdmin ? 'team' : 'pro',
                  trialStart: Date.now(),
                  trialEnd: isAdmin ? Date.now() + 100 * 365 * 24 * 3600 * 1000 : Date.now() + 14 * 24 * 3600 * 1000,
                  studyRole: isAdmin ? 'Lead Architect & Admin' : undefined,
                  subject: isAdmin ? 'Platform Architecture' : undefined,
                  storageUsedBytes: 0,
                  storageLimitBytes: isAdmin ? 100 * 1024 * 1024 * 1024 : 10 * 1024 * 1024 * 1024
                };

                localStorage.setItem('scribblenote_cached_user', JSON.stringify(account));
                window.history.replaceState(null, '', window.location.pathname + '#app');
              }
            }
          } catch (e) {
            console.warn('[EarlyAuth] Parse warning:', e);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 select-none">
    <div id="root">
      <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000000;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;flex-direction:column;gap:16px;">
        <div style="width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(37,99,235,0.4);">
          <svg style="width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
          </svg>
        </div>
        <div style="font-size:13px;font-weight:600;letter-spacing:0.02em;color:#94a3b8;">Loading ScribbleNote...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
